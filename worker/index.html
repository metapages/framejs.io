    /**
     * Enlarged (touch-sized) edit button on narrow viewports.
     *
     * `max-width: 768px` alone is not enough: these frames are usually iframed,
     * and an embedded frame is frequently narrower than 768px while being
     * nothing like a phone screen. In a small embed the big button covers a
     * large fraction of the app, so the extra `min-width`/`min-height` guards
     * keep the enlarged button for real phone-sized viewports only. Anything
     * smaller in either dimension falls back to the regular-size button.
     */
    @media (max-width: 768px) and (min-width: 340px) and (min-height: 500px) {
      #menu-button {

    .invisible-until-hover {

    /**
     * Draggable divider between the rendered output (#root) and the editor
     * pane (#editor-root). It sits on the boundary — its `right` offset is kept
     * in sync with the editor width in JS. This is also the escape hatch when
     * the editor is set too narrow to reach the width setting: the strip is
     * always grabbable regardless of how narrow the editor is.
     */
    #editor-resize-handle {
      position: absolute;
      top: 0;
      height: 100vh;
      width: 10px;
      z-index: 4;
      cursor: col-resize;
      display: none;
      background: transparent;
      /* `right` is set in JS to match the current editor width */
    }

    #editor-resize-handle::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 100%;
      width: 1px;
      background: #d0d0d0;
      transition: background 0.15s, width 0.15s;
    }

    /* Little horizontal caps at the very top and bottom that close the gap
       between the divider's vertical line (this handle's center) and the
       editor pane's left border (this handle's right edge). A single box
       spanning that gap with only top/bottom borders draws both caps. */
    #editor-resize-handle::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      right: 0;
      height: 100%;
      border-top: 1px solid #d0d0d0;
      border-bottom: 1px solid #d0d0d0;
      pointer-events: none;
    }

    #editor-resize-handle:hover::after,
    #editor-resize-handle.dragging::after {
      background: #2563eb;
      width: 3px;
    }

    /* While dragging: show the resize cursor everywhere and stop the editor
       iframe / output from swallowing the mousemove events. */
    body.resizing {
      cursor: col-resize;
      user-select: none;
    }

    body.resizing #editor-root,
    body.resizing #root {
      pointer-events: none;
    }

        ctx.beginpath();
        ctx.arc(p.x, p.y, p.r, 0, math.pi * 2);
        ctx.fillstyle = `hsl(210, 40%, ${50 + p.r * 10}%)`;
        ctx.fill();
        }

    <script id="service-worker-setup" type="module">
    // Service Worker Configuration - will be set after imports are available
    globalThis.serviceWorkerConfig = null;

    // Service Worker management functions
    globalThis.serviceWorkerManager = {
      registration: null,

      async register() {
        if ("serviceWorker" in navigator) {
          try {
            const registration = await navigator
              .serviceWorker
              .register("/sw.js");
            this.registration = registration;
            if (
              globalThis.serviceWorkerConfig
                ?.enableLogging
            ) {
              console.log(
                "[SW Manager] Service worker registered:",
                registration,
              );
            }

            // Handle service worker updates
            registration.addEventListener("updatefound", () => {
              const newWorker = registration.installing;
              if (
                globalThis.serviceWorkerConfig
                  ?.enableLogging
              ) {
                console.log("[SW Manager] New service worker installing...");
              }

              newWorker.addEventListener("statechange", () => {
                if (
                  newWorker.state === "installed" &&
                  navigator.serviceWorker.controller
                ) {
                  if (
                    globalThis.serviceWorkerConfig
                      ?.enableLogging
                  ) {
                    console.log(
                      "[SW Manager] New service worker installed, will activate on page refresh",
                    );
                    console.log(
                      "🔄 Website updated! Refresh the page to get the latest version.",
                    );
                  }
                }
              });
            });

            // Listen for controller changes (when new SW takes control)
            navigator
              .serviceWorker
              .addEventListener("controllerchange", () => {
                if (
                  globalThis.serviceWorkerConfig
                    ?.enableLogging
                ) {
                  console.log(
                    "[SW Manager] Service worker updated and active",
                  );
                }
                // Send configuration to new service worker
                setTimeout(() => {
                  this.updateConfig(globalThis.serviceWorkerConfig);
                }, 100);
              });

            // Send initial configuration
            if (navigator.serviceWorker.controller) {
              await this.updateConfig(globalThis.serviceWorkerConfig);
            }

            return registration;
          } catch (error) {
            if (
              globalThis.serviceWorkerConfig
                ?.enableLogging
            ) {
              console.error(
                "[SW Manager] Service worker registration failed:",
                error,
              );
            }
            throw error;
          }
        } else {
          if (
            globalThis.serviceWorkerConfig
              ?.enableLogging
          ) {
            console.warn("[SW Manager] Service workers not supported");
          }
          throw new Error("Service workers not supported");
        }
      },

      async updateConfig(config) {
        if (!navigator.serviceWorker.controller) {
          if (
            globalThis.serviceWorkerConfig
              ?.enableLogging
          ) {
            console.warn(
              "[SW Manager] No active service worker to configure",
            );
          }
          return;
        }

        return new Promise((resolve, reject) => {
          const channel = new MessageChannel();
          channel.port1.onmessage = (event) => {
            if (event.data.success) {
              if (
                globalThis.serviceWorkerConfig
                  ?.enableLogging
              ) {
                console.log("[SW Manager] Configuration updated");
              }
              resolve(event.data);
            } else {
              reject(new Error("Failed to update configuration"));
            }
          };

          navigator
            .serviceWorker
            .controller
            .postMessage({
              type: "UPDATE_CONFIG",
              payload: config,
            }, [channel.port2]);
        });
      },

      async getConfig() {
        if (!navigator.serviceWorker.controller) {
          return null;
        }

        return new Promise((resolve) => {
          const channel = new MessageChannel();
          channel.port1.onmessage = (event) => {
            resolve(event.data.config);
          };

          navigator
            .serviceWorker
            .controller

     *

     * @returns The decoded data.
     *
     * @example
     * ```ts
     * import { decodeBase64 } from "https://deno.land/std@$STD_VERSION/encoding/base64.ts";
     *
     * decodeBase64("Zm9vYmFy"); // Uint8Array(6) [ 102, 111, 111, 98, 97, 114 ]
     * ```
     */
    function decodeBase64(b64string) {
      //: Uint8Array
      const binString = atob(b64string);
      const size = binString.length;
      const bytes = new Uint8Array(size);
      for (let i = 0; i < size; i++) {
        bytes[i] = binString.charCodeAt(i);
      }
      return bytes;
    }

    const urlToUint8Array = async (url) => {
      //: Promise<Uint8Array>
      const response = await fetch(url, { redirect: "follow" });
      if (!response.ok) {
        throw new Error(
          `Failed to fetch ${url}: ${response.statusText}`,
        );
      }
      const contentType = response.headers.get("content-type") ||
        "application/octet-stream";
      const arrayBuffer = await response.arrayBuffer();
      return {
        buffer: new Uint8Array(arrayBuffer),
        type: contentType,
      };
    };

    const fetchBlobFromHash = async (hash, address) => {
      //: Promise<ArrayBuffer>
      const resp = await fetch(`${address}/download/${hash}`);
      const json = await resp.json(); //: { url: string; ref: DataRef }
      const { buffer } = await urlToUint8Array(json.url);
      return buffer;
    };

    const fetchBlobFromHashWithType = async (hash, address) => {
      //: Promise<{buffer: Uint8Array, type: string}>
      const resp = await fetch(`${address}/download/${hash}`);
      const json = await resp.json(); //: { url: string; ref: DataRef }
      return await urlToUint8Array(json.url);
    };

    const DataRefTypesSet = new Set([
      "base64",
      "utf8",
      "json",
      "url",
      "key",
    ]);
    const isDataRef = (ref) => {
      //: boolean
      return !!(
        typeof ref === "object" &&
        ref?.value &&
        // in some libraries the url is the default, and not set
        (DataRefTypesSet.has(ref?.type) ||
          (typeof (ref?.value) === "string" &&
            ref?.value.startsWith("http")))
      );
    };

    // Fast check: returns true if the value tree contains any Blob instances
    const containsBlob = (obj) => {
      if (!obj || typeof obj !== "object") return false;
      if (obj instanceof Blob) return true;
      if (Array.isArray(obj)) {
        for (let i = 0; i < obj.length; i++) {
          if (containsBlob(obj[i])) return true;
        }
        return false;
      }
      for (const key of Object.keys(obj)) {
        if (containsBlob(obj[key])) return true;
      }
      return false;
    };

    /**
     * Smart input unpacking: converts Blobs with content-type: application/json to JSON objects.
     * Recursively walks through an object and converts Blob leaves to JSON
     * if the blob type is application/json or the key name ends with .json
     */
    const smartUnpackInputs = async (inputs, parentKey = "") => {
      if (!inputs || typeof inputs !== "object") {
        return inputs;
      }

      // Fast path: if no Blobs anywhere in the tree, return as-is (no deep copy)
      if (!parentKey && !containsBlob(inputs)) {
        return inputs;
      }

      // Handle Blob directly
      if (inputs instanceof Blob) {
        const isJsonByType = inputs.type === "application/json" ||
          inputs.type.startsWith("application/json");
        const isJsonByName = parentKey.toLowerCase().endsWith(
          ".json",
        );

        if (isJsonByType || isJsonByName) {
          try {
            const text = await inputs.text();
            return JSON.parse(text);
          } catch (err) {
            console.warn(
              `Failed to parse JSON from blob (key: ${parentKey}):`,
              err,
            );
            return inputs;
          }
        }
        return inputs;
      }

      // Handle arrays
      if (Array.isArray(inputs)) {
        const result = [];
        for (let i = 0; i < inputs.length; i++) {
          result[i] = await smartUnpackInputs(
            inputs[i],
            `${parentKey}[${i}]`,
          );
        }
        return result;
      }

      // Handle plain objects
      const result = {};
      for (const key of Object.keys(inputs)) {
        const value = inputs[key];
        const fullKey = parentKey ? `${parentKey}.${key}` : key;

        if (value instanceof Blob) {
          const isJsonByType = value.type === "application/json" ||
            value.type.startsWith("application/json");
          const isJsonByName = key.toLowerCase().endsWith(".json");

          if (isJsonByType || isJsonByName) {
            try {
              const text = await value.text();
              result[key] = JSON.parse(text);
            } catch (err) {
              console.warn(
                `Failed to parse JSON from blob (key: ${fullKey}):`,
                err,
              );
              result[key] = value;
            }
          } else {
            result[key] = value;
          }
        } else if (
          value && typeof value === "object" &&
          !(value instanceof Blob)
        ) {
          result[key] = await smartUnpackInputs(value, fullKey);
        } else {
          result[key] = value;
        }
      }
      return result;
    };

    const getInputsSmartUnpacked = async () => {
      const inputs = metaframe.getInputs();
      return await smartUnpackInputs(inputs);
    };

    const refreshUpdateSvgButton = () => {
      // only show the edit button if we are NOT in an iframe
      // or explicitly edit=true is in the hash params
      // this will be turned into a configurable option later, but no time rn
      const [_, hashParams] = getUrlHashParamsFromHashString(currentHashString());
      const inEditMode = hashParams["edit"] === "true";
      if (inEditMode) {
        // do NOT change the visibility of the edit buttons
        return;
      }
      const menuButton = document.getElementById("menu-button");
      if (hashParams["hm"] === "disabled") {
        menuButton.style.display = "none";
      } else {
        menuButton.style.display = "flex";
        if (hashParams["hm"] === "invisible") {
          menuButton.classList.add("invisible-until-hover");
        } else if (hashParams["hm"] === "visible") {
          menuButton.classList.remove("invisible-until-hover");
        } else {
          // default is invisible but clickable for iframe apps, and visible for non-iframe apps
          // NOTE: changing this so that the experience is consistent across contexts 10/21/24 CW
          menuButton.classList.add("invisible-until-hover");
        }
      }
    };

    // global object to store loading state
    window.__metaframejs = { awaiting: [] };

    // Dynamically add <script> and <link> tags to the document.head
    // and listen to the load events
    const ensureModulesLoaded = async () => {
      let modules = getHashParamValueJsonFromHashString(
        currentHashString(),
        "modules",
      );
      // Load a single script, module, or css, awaiting until done
      const loadModuleOrCss = async (s) => {
        return new Promise((resolve, reject) => {
          // import maps are handled in the import-map-loader script
          if (s.startsWith("{")) {
            resolve();
            return;
          }
          // if (!foundImportMap && s.startsWith("{")) {
          //   try {
          //     if (foundImportMap) {
          //       window.logStderr(
          //         "Found multiple import maps, only the first will be used"
          //       );
          //       return;
          //     }
          //     const maybeImports = JSON.parse(decodeURIComponent(s));
          //     if (maybeImports.imports) {
          //       foundImportMap = true;
          //       var importMapElement = document.createElement("script");
          //       importMapElement.innerHTML = decodeURIComponent(s);
          //       importMapElement.type = "importmap";
          //       document
          //         .getElementsByTagName("head")[0]
          //         .appendChild(importMapElement);
          //       // import maps do not fire onload events, so resolve here
          //       // the timing of this may not be perfect, so note this here
          //       // in case there are issues
          //       resolve();
          //       return;
          //     }
          //   } catch (e) {
          //     console.log("Error loading module", s);
          //     window.logStderr(`error loading module: ${s}`);
          //     return;
          //   }
          // } else {
          let elementTrimmed = s.trim();
          if (elementTrimmed.endsWith(".css")) {
            const linkImport = document.createElement("link");
            linkImport.href = elementTrimmed;
            linkImport.rel = "stylesheet";
            linkImport.addEventListener("load", () => {
              resolve();
            });
            linkImport.addEventListener("error", (err) => {
              console.log("Error loading link", elementTrimmed);
              window.logStderr(
                `error loading script: ${elementTrimmed} error: ${err}`,
              );
              reject(err);
            });
            document
              .getElementsByTagName("head")[0]
              .appendChild(linkImport);
          } else if (elementTrimmed.startsWith("<link")) {
            const href = /<link\s+.*href="([^"]*)"/.exec(
              elementTrimmed,
            )?.[1];
            if (href) {
              const linkImport = document.createElement("link");
              linkImport.href = href;
              const linkRel = /<link\s+.*rel="([^"]*)"/.exec(
                elementTrimmed,
              )?.[1];
              if (linkRel) {
                linkImport.rel = linkRel;
              }
              const linkType = /<link\s+.*type="([^"]*)"/.exec(
                elementTrimmed,
              )?.[1];
              if (linkType) {
                linkImport.type = linkType;
              }

              const linkCrossorigin = /<link\s+.*crossorigin="([^"]*)"/.exec(
                elementTrimmed,
              )?.[1];
              if (linkCrossorigin) {
                linkImport.crossorigin = linkCrossorigin;
              }

              linkImport.addEventListener("load", () => {
                resolve();
              });
              linkImport.addEventListener("error", (err) => {
                console.log("Error loading link", elementTrimmed);
                window.logStderr(
                  `error loading script: ${elementTrimmed} error: ${err}`,
                );
                reject(err);
              });

              document
                .getElementsByTagName("head")[0]
                .appendChild(linkImport);
            }
          } else if (elementTrimmed.startsWith("<script")) {
            const src = /<script\s+.*src="([^"]*)"/.exec(
              elementTrimmed,
            )?.[1];
            if (src) {
              const scriptImport = document.createElement("script");
              scriptImport.async = true;
              scriptImport.src = src;
              const scriptType = /<script\s+.*type="([^"]*)"/.exec(
                elementTrimmed,
              )?.[1];
              if (scriptType) {
                scriptImport.type = scriptType;
              }
              const scriptCrossorigin = /<script\s+.*crossorigin="([^"]*)"/
                .exec(
                  elementTrimmed,
                )?.[1];
              if (scriptCrossorigin) {
                scriptImport.crossorigin = scriptCrossorigin;
              }
              scriptImport.addEventListener("load", () => {
                resolve();
              });
              scriptImport.addEventListener("error", (err) => {
                console.log("Error loading script", elementTrimmed);
                window.logStderr(
                  `error loading script: ${elementTrimmed} error: ${err}`,
                );
                reject(err);
              });

              document
                .getElementsByTagName("head")[0]
                .appendChild(scriptImport);
            }
          } else {
            // Assume it's a script
            const scriptImport = document.createElement("script");
            scriptImport.src = s;
            scriptImport.async = true;
            scriptImport.addEventListener("load", () => {
              resolve();
            });
            scriptImport.addEventListener("error", (err) => {
              console.log("Error loading script", elementTrimmed);
              window.logStderr(
                `error loading script: ${elementTrimmed} error: ${err}`,
              );
              reject(err);
            });

            document
              .getElementsByTagName("head")[0]
              .appendChild(scriptImport);
          }
        });

        // if (s.endsWith(".css")) {
        //   return new Promise((resolve, reject) => {
        //       const script = document.createElement('script');
        //       script.type = 'module';
        //       script.src = url;

        //       script.onload = () => resolve(`Script loaded: ${url}`);
        //       script.onerror = () => reject(`Error loading script: ${url}`);

        //       document.head.appendChild(script);
        //   });
      };

      if (modules) {
        const results = await Promise.allSettled(
          modules.map((scriptOrCss) => loadModuleOrCss(scriptOrCss)),
        );
        for (const result of results) {
          if (result.status === "rejected") {
            console.error(result.reason);
          }
        }
      }
    };

    const modulesLoadingPromise = ensureModulesLoaded();

    window.__metaframejs.awaiting = [modulesLoadingPromise];

    const getJsFromUrl = () => {
      let jsFromUrl = getHashParamValueBase64DecodedFromUrl(currentHashUrl(), "js");
      // deal with bad double encoded data from old version of hash-query
      if (
        jsFromUrl &&
        (jsFromUrl.startsWith("%") ||
          (jsFromUrl.indexOf("\n") === -1 &&
            jsFromUrl.indexOf("%") > -1))
      ) {
        jsFromUrl = decodeURIComponent(jsFromUrl);
      }

      return jsFromUrl;
    };

    // TODO: do same as above (modules in hash params) for config

    // The id used to tag the injected <style>/<link> so we can find/replace/
    // remove it when the `css` hash param changes.
    const CSS_HASH_PARAM_ELEMENT_ID = "mtfm-css-hash-param";

    // A decoded value is treated as a stylesheet URL (injected as <link>) when
    // it is a single-line http(s) URL; otherwise it is raw CSS text (<style>).
    const isCssStylesheetUrl = (value) => {
      const trimmed = value.trim();
      return /^https?:\/\/\S+$/.test(trimmed) && !/\s/.test(trimmed);
    };

    // Loads a global stylesheet from the transient `css` hash param. The value
    // is base64-encoded and is either raw CSS text or a URL to a stylesheet.
    //
    // This param is intentionally NOT in the canonical/allowed hash param
    // lists, so it is never persisted into the metaframe definition, copied
    // external links, or shortened URLs. It is appended at runtime to apply a
    // global style across the rendered output without modifying its content
    // (so the underlying short URLs stay valid).
    const applyCssFromUrl = () => {
      // Always remove any previously injected element first so changing or
      // clearing the param fully replaces the prior stylesheet.
      document.getElementById(CSS_HASH_PARAM_ELEMENT_ID)?.remove();

      const css = getHashParamValueBase64DecodedFromUrl(currentHashUrl(), "css");
      if (!css) return;

      let element;
      if (isCssStylesheetUrl(css)) {
        element = document.createElement("link");
        element.rel = "stylesheet";
        element.href = css.trim();
      } else {
        element = document.createElement("style");
        element.textContent = css;
      }
      element.id = CSS_HASH_PARAM_ELEMENT_ID;
      document.head.appendChild(element);
    };

    // Resolve the effective editor width from the parsed hash params, applying
    // the "80ch" default and the bare-number -> ch coercion.
    const getEditorWidthFromParams = (hashParams) => {
      let editorWidth = hashParams["editorWidth"] || "80ch";
      // If the last character is a number, assume 'ch' units.
      if (/\d$/.test(editorWidth)) {
        editorWidth = `${editorWidth}ch`;
      }
      return editorWidth;
    };

    // Apply the output/editor split widths and position the resize handle.
    // Pure layout: safe to call on any hashchange without re-running user JS.
    const applyEditorLayout = () => {
      const [, hashParams] = getUrlHashParamsFromHashString(currentHashString());
      const inEditMode = hashParams["edit"] === "true";
      const editorWidth = getEditorWidthFromParams(hashParams);

      const root = document.getElementById("root");
      const editor = document.getElementById("editor-root");
      const handle = document.getElementById("editor-resize-handle");

      root.style.width = inEditMode ? `calc(100% - ${editorWidth})` : "100%";
      editor.style.width = inEditMode ? `${editorWidth}` : "0%";
      if (handle) {
        if (inEditMode) {
          handle.style.right = editorWidth;
          handle.style.display = "block";
        } else {
          handle.style.display = "none";
        }
      }
    };

    // Wire up drag-to-resize on the divider. The editor pane is pinned to the
    // right edge, so its width is (viewport width - pointer x). Live updates
    // are written straight to the inline styles for smoothness; the final width
    // is persisted to the `editorWidth` hash param on release.
    const setupEditorResizeHandle = () => {
      const handle = document.getElementById("editor-resize-handle");
      if (!handle) return;

      const MIN_WIDTH_PX = 120;

      const widthFromPointer = (clientX) => {
        const max = window.innerWidth - 80; // always leave some output visible
        const px = window.innerWidth - clientX;
        return Math.max(MIN_WIDTH_PX, Math.min(max, px));
      };

      const applyWidthPx = (px) => {
        const root = document.getElementById("root");
        const editor = document.getElementById("editor-root");
        root.style.width = `calc(100% - ${px}px)`;
        editor.style.width = `${px}px`;
        handle.style.right = `${px}px`;
      };

      const onMove = (e) => {
        e.preventDefault();
        applyWidthPx(widthFromPointer(e.clientX));
      };

      const onUp = (e) => {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        document.body.classList.remove("resizing");
        handle.classList.remove("dragging");
        const px = widthFromPointer(e.clientX);
        applyWidthPx(px);
        // Persist. Uses a 'px' suffix so the value is not re-coerced to 'ch'.
        setHashParamInWindow("editorWidth", `${Math.round(px)}px`);
      };

      handle.addEventListener("mousedown", (e) => {
        // Only the primary button starts a resize.
        if (e.button !== 0) return;
        e.preventDefault();
        document.body.classList.add("resizing");
        handle.classList.add("dragging");
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });
    };
    setupEditorResizeHandle();

    /**
     * Re-running the user's JS wipes #root, taking every scrolled element with
     * it — while editing that yanks the view back to the top on each debounce.
     * Offsets are therefore remembered as the user scrolls, and re-applied
     * after the re-run.
     *
     * A scroller is identified by how it looks (`div.list`) plus which
     * same-looking scroller it is, because the element itself does not survive
     * the wipe. Only boxes that actually scroll are considered: an element can
     * report plenty of content and still refuse `scrollTop`, and matching on
     * name alone picks that one.
     */
    const SCROLL_RESTORE_TIMEOUT_MS = 4000;
    // How long to keep re-asserting the offset after it first lands
    const SCROLL_HOLD_MS = 1500;
    // Frames to let the fresh render settle before the first restore attempt
    const SCROLL_RESTORE_DELAY_TICKS = 3;
    // getComputedStyle is not free, so the scroller scan is cached this long
    const SCROLL_RESCAN_MS = 200;
    // Subtrees that are ours, not the user's rendered output
    const SCROLL_SKIP_IDS = new Set(["editor-root", "menu-button"]);
    const DOCUMENT_SCROLLER = "document";

    // Gated on the `options.debug` hash param, like the rest of this file
    const scrollLog = (...args) => {
      if (globalThis.serviceWorkerConfig?.enableLogging) {
        console.log("[scroll]", ...args);
      }
    };

    const describeElement = (el) =>
      `${el.tagName.toLowerCase()}${el.id ? "#" + el.id : ""}${
        el.className && typeof el.className === "string"
          ? "." + el.className.trim().split(/\s+/).join(".")
          : ""
      }`;

    // Cheap layout test first: only overflowing boxes are worth a style lookup
    const canScroll = (el) =>
      (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) &&
      /auto|scroll|overlay/.test(getComputedStyle(el).overflow);

    let scrollerCache = { at: -Infinity, elements: [] };
    // `fresh` skips the cache where a stale list would be wrong rather than
    // merely slow: a re-run replaces the whole tree in well under the cache
    // window, so both ends of a restore have to look at the DOM as it is now.
    const scrollers = (fresh) => {
      const now = performance.now();
      if (!fresh && now - scrollerCache.at < SCROLL_RESCAN_MS) {
        return scrollerCache.elements;
      }
      const elements = [];
      const walk = (el) => {
        if (SCROLL_SKIP_IDS.has(el.id)) return;
        if (canScroll(el)) elements.push(el);
        for (let i = 0; i < el.children.length; i++) walk(el.children[i]);
      };
      walk(document.body);
      scrollerCache = { at: now, elements };
      return elements;
    };

    // Null for anything that is not one of the user's scrolling boxes — that
    // also filters out our own chrome, which the scan prunes.
    const scrollerKey = (el, fresh) => {
      if (el === document.scrollingElement) return DOCUMENT_SCROLLER;
      const desc = describeElement(el);
      const peers = scrollers(fresh).filter(
        (peer) => describeElement(peer) === desc,
      );
      const nth = peers.indexOf(el);
      return nth === -1 ? null : `${desc}#${nth}`;
    };

    const scrollerForKey = (key) => {
      if (key === DOCUMENT_SCROLLER) return document.scrollingElement;
      const desc = key.slice(0, key.lastIndexOf("#"));
      const nth = Number(key.slice(key.lastIndexOf("#") + 1));
      const peers = scrollers().filter((peer) => describeElement(peer) === desc);
      return peers[nth] ?? peers[0] ?? null;
    };

    // Remembered as it happens: by the time the re-run wipes the DOM the
    // position can be gone, and a frame that tears down its own scroller first
    // leaves nothing to read at all.
    const scrollMemory = new Map();
    // Keys are resolved once per element — the scan behind them is not free
    const scrollKeyCache = new WeakMap();
    // Our own writes fire scroll events; recording those would overwrite the
    // remembered offset with whatever the half-rendered content clamps to.
    let scrollTrackingSuspended = false;

    globalThis.addEventListener("scroll", (event) => {
      if (scrollTrackingSuspended) return;
      const el = event.target === document
        ? document.scrollingElement
        : event.target;
      if (!el || el.nodeType !== 1) return;

      let key = scrollKeyCache.get(el);
      if (!key) {
        // Once per element, so the rescan here is affordable
        key = scrollerKey(el, true);
        if (!key) return;
        scrollKeyCache.set(el, key);
      }
      if (!el.scrollTop && !el.scrollLeft) {
        if (scrollMemory.delete(key)) scrollLog(`forgot ${key} (back at the top)`);
        return;
      }
      const known = scrollMemory.get(key);
      scrollMemory.set(key, { key, top: el.scrollTop, left: el.scrollLeft });
      if (!known) scrollLog(`tracking ${key} @${el.scrollTop},${el.scrollLeft}`);
    }, { capture: true, passive: true }); // scroll does not bubble

    // Scroll events are delivered asynchronously, so the DOM can be ahead of
    // the memory (a scroll in the same tick as the edit). Sweep the live
    // scrollers and let them win; memory covers whatever is already gone.
    const rememberedScrollPositions = () => {
      const merged = new Map(scrollMemory);
      const doc = document.scrollingElement;
      const live = scrollers(true).concat(doc ? [doc] : []);
      live.forEach((el) => {
        if (!el.scrollTop && !el.scrollLeft) return;
        const key = scrollerKey(el);
        if (key) merged.set(key, { key, top: el.scrollTop, left: el.scrollLeft });
      });

      const entries = [...merged.values()];
      scrollLog(
        entries.length
          ? `remembered ${entries.length}: ${
            entries.map((e) => `${e.key} @${e.top},${e.left}`).join(" | ")
          }`
          : "no remembered scroll positions",
      );
      return entries;
    };

    const restoreScrollPositions = (remembered) => {
      if (!remembered.length) return;
      const started = performance.now();
      const deadline = started + SCROLL_RESTORE_TIMEOUT_MS;
      const userEvents = ["wheel", "touchstart", "keydown"];
      // Under `scroll-behavior: smooth` a plain assignment only *starts* an
      // animation: the read-back is still the old position, and re-asserting
      // each frame restarts it from there, pinning the element at the top. An
      // inline override beats the frame's stylesheet; put its own value back
      // when we are done.
      const smoothSuspended = new Map();
      let userGesture = null;
      let arrivedAt = null;

      const noteGesture = (event) => {
        userGesture = event.type;
      };
      scrollTrackingSuspended = true;
      const stop = () => {
        scrollTrackingSuspended = false;
        smoothSuspended.forEach((previous, el) => {
          el.style.scrollBehavior = previous;
        });
        userEvents.forEach((name) =>
          globalThis.removeEventListener(name, noteGesture, true)
        );
      };
      // Capture phase, so we see the gesture even if the frame stops it.
      // NOTE: a gesture only ends the restore *after* the offset has landed.
      // Backing off before that would strand the user at the top — the wipe
      // already took their position away, so there is nothing to protect yet.
      // In practice the editor's debounce commonly fires while the user is
      // still scrolling around looking at the output.
      userEvents.forEach((name) =>
        globalThis.addEventListener(name, noteGesture, {
          capture: true,
          passive: true,
        })
      );

      const step = () => {
        if (arrivedAt && userGesture) {
          stop();
          scrollLog(`released: user ${userGesture} took over`);
          return;
        }
        userGesture = null;

        // Landing the offset once is not enough: frames that lay out in stages
        // (fonts, images, charts, a ResizeObserver pass) knock it back after.
        const missing = [];
        remembered.forEach(({ key, top, left }) => {
          const el = scrollerForKey(key);
          if (!el) {
            missing.push(key);
            return;
          }
          if (!smoothSuspended.has(el)) {
            smoothSuspended.set(el, el.style.scrollBehavior);
            el.style.scrollBehavior = "auto";
          }
          // Assigning clamps to the current content size, so this is a no-op
          // until the re-rendered content is big enough to scroll that far.
          el.scrollTop = top;
          el.scrollLeft = left;
          if (el.scrollTop !== top || el.scrollLeft !== left) missing.push(key);
        });

        if (!missing.length && !arrivedAt) {
          arrivedAt = performance.now();
          scrollLog(
            `restored ${remembered.length} in ${
              Math.round(arrivedAt - started)
            }ms, holding ${SCROLL_HOLD_MS}ms`,
          );
        }
        if (arrivedAt && performance.now() - arrivedAt > SCROLL_HOLD_MS) {
          stop();
          scrollLog("hold released");
          return;
        }
        if (!arrivedAt && performance.now() > deadline) {
          stop();
          scrollLog(
            `gave up after ${SCROLL_RESTORE_TIMEOUT_MS}ms on ${
              missing.join(" | ")
            } — scrollable now: ${
              scrollers().map(describeElement).join(" | ") || "nothing"
            }`,
          );
          return;
        }
        requestAnimationFrame(step);
      };

      // Let the fresh render put its content up before the first attempt, so
      // the offset is not clamped against a still-empty page.
      let ticks = SCROLL_RESTORE_DELAY_TICKS;
      const waitTicks = () =>
        ticks-- > 0 ? requestAnimationFrame(waitTicks) : step();
      requestAnimationFrame(waitTicks);
    };

    const runJsFromUrl = async () => {
      // if there is a scriptUnload function, run it
      // The previous script has the option to put a cleanup function on the window
      if (globalThis.scriptUnload) {
        try {
          globalThis.scriptUnload();
        } catch (err) {
          console.error(
            "Error running globalThis.scriptUnload()",
            err,
          );
        }
      }

      // Older user scripts set this themselves. To handle those old metaframes
      // make sure we clear it out here to detect if the user set it
      globalThis.scriptUnload = null;

      let js = getJsFromUrl();

      // ensure all modules are loaded
      await Promise.all(window.__metaframejs.awaiting);

      const [_, hashParams] = getUrlHashParamsFromHashString(currentHashString());

      const inEditMode = hashParams["edit"] === "true";
      const defaultBgColor = hashParams["bgColor"];
      if (!inEditMode) {
        removeEditor();
      }

      // set up (maybe re-override globals)
      const root = document.getElementById("root");
      if (defaultBgColor) {
        root.style.background = defaultBgColor;
      }

      // Apply the output/editor split widths (also positions the resize handle).
      applyEditorLayout();

      if (js) {
        const previousScrollPositions = rememberedScrollPositions();
        // clear all children of root (landing content or previous user code)
        root.textContent = "";
        try {
          globalThis.root = root;
          globalThis.setOutput = (key, value) => {
            metaframe.setOutput(key, value);
          };
          globalThis.setOutputs = (outputs) => {
            metaframe.setOutputs(outputs);
          };

          js = `"use strict"\n${js}`;

          // Create a Blob with the user code
          const blob = new Blob([js], {
            type: "application/javascript",
          });
          // Create an object URL for the Blob
          const url = URL.createObjectURL(blob);
          let module = null;
          try {
            // Dynamically import the module using the Blob URL
            module = await import(url);
          } catch (error) {
            globalThis.logStderr(
              `Error importing module: ${error.message}`,
            );
          } finally {
            // Clean up by revoking the object URL
            URL.revokeObjectURL(url);
          }

          if (!module) {
            return;
          }

          restoreScrollPositions(previousScrollPositions);

          // Move the user scriptUnload from global to local since we create our own
          const userCleanup = globalThis.scriptUnload;
          globalThis.scriptUnload = null;

          const ourHandleResize = (width, height) => {
            if (module.onResize) {
              try {
                module.onResize(width, height);
              } catch (err) {
                console.error("Error running onResize", err);
              }
            }

            if (module.handleResize) {
              try {
                module.handleResize(width, height);
              } catch (err) {
                console.error("Error running handleResize", err);
              }
            }
          };

          const resizeObserver = new ResizeObserver((entries) => {
            const entry = entries[entries.length - 1];
            const { width, height } = entry.contentRect;
            ourHandleResize(width, height);
          });
          resizeObserver.observe(root);

          const options = getHashParamValueJsonFromHashString(
            currentHashString(),
            "options",
          );

          const disableDatarefs = options?.disableDatarefs;
          const disableSmartInputUnpacking = options
            ?.disableSmartInputUnpacking;

          const handleInputs = async (inputs) => {
            if (module.onInputs) {
              try {
                // Check if dataref conversion is disabled
                if (!disableDatarefs) {
                  // Unwrap v2 url datarefs (data:text/x-uri,<encoded url>) so
                  // they resolve like any other url ref below.
                  if (inputs) {
                    for (const key of Object.keys(inputs)) {
                      const urlRef = normalizeUrlDataRef(inputs[key]);
                      if (urlRef) {
                        inputs[key] = urlRef;
                      }
                    }
                  }
                  const datarefKeys = inputs
                    ? Object.keys(inputs).filter((key) => isDataRef(inputs[key]))
                    : null;
                  if (datarefKeys && datarefKeys.length > 0) {
                    const resolved = await Promise.all(
                      datarefKeys.map((key) => resolveDataRef(inputs[key])),
                    );
                    for (let i = 0; i < datarefKeys.length; i++) {
                      inputs[datarefKeys[i]] = resolved[i];
                    }
                  }
                }

                // Smart input unpacking: convert JSON blobs to objects
                // This inspects leaves of the input JSON, and if there are blobs
                // with type json or input name ending with .json, converts them to objects
                if (!disableSmartInputUnpacking) {
                  inputs = await smartUnpackInputs(inputs);
                }

                module.onInputs(inputs);
              } catch (err) {
                console.error("Error running onInputs", err);
              }
            }
            try {
              if (
                globalThis.metapageEditor &&
                !globalThis.metapageEditor.isDisposed()
              ) {
                // If user disabled smart unpacking, unpack just for the editor
                const editorInputs = disableSmartInputUnpacking
                  ? await smartUnpackInputs(inputs)
                  : inputs;
                globalThis.metapageEditor.setInputs({
                  editor: editorInputs,
                });
              }
            } catch (err) {
              console.error(
                "Error setting metapage editor inputs",
                err,
              );
            }
          };

          const disposeInputsListener = metaframe.onInputs(
            handleInputs,
          );

          handleInputs(metaframe.getInputs());

          // Handle inputs from hash parameter
          const hashInputs = getHashParamValueJsonFromHashString(
            currentHashString(),
            "inputs",
          );
          if (hashInputs && module.onInputs) {
            await handleInputs(hashInputs);
          }

          const cleanupHandler = () => {
            try {
              if (typeof userCleanup === "function") {
                userCleanup();
              }
            } catch (err) {
              console.error("Error running user cleanup", err);
            }
            resizeObserver.disconnect();
            disposeInputsListener();
            globalThis.removeEventListener("resize", ourHandleResize);
            if (typeof module.cleanup === "function") {
              try {
                module.cleanup();
              } catch (err) {
                console.error("Error running cleanup", err);
              }
            }
            if (typeof module.dispose === "function") {
              try {
                module.dispose();
              } catch (err) {
                console.error("Error running dispose", err);
              }
            }
            if (typeof module.unload === "function") {
              try {
                module.unload();
              } catch (err) {
                console.error("Error running unload", err);
              }
            }
          };

          globalThis.scriptUnload = cleanupHandler;
        } catch (err) {
          console.error(err);
        }
      } else {
        // No code — restore and show the landing content
        root.innerHTML = __landingHtml;
        const landing = document.getElementById("landing-content");
        if (landing) landing.style.display = "";
      }
    };

    // Examine URL, and add modules
    globalThis.metapage = {
      Metapage,
      Metaframe,
    };

    if (!globalThis.metaframe) {
      globalThis.metaframe = new Metaframe();
    }
    var metaframe = globalThis.metaframe;

    metaframe.connected().then(() => metaframe.log("connected"));

    // Apply the transient `css` hash param stylesheet on initial load.
    applyCssFromUrl();

    // Handle Safari timing issue: check if page is already loaded.
    if (document.readyState === "complete") {
      runJsFromUrl();
    } else {
      globalThis.addEventListener("load", function () {
        runJsFromUrl();
      });
    }

    // Hash params that do NOT require JS re-execution (metadata-only).
    // `css` is applied separately via applyCssFromUrl() on hashchange, so it
    // must not trigger a full re-run of the user's JS.
    // `editorWidth` only affects the layout split, applied via
    // applyEditorLayout() on hashchange — it must not re-run the user's JS.
    // `edit` is chrome, not content: it opens/closes the editor pane beside the
    // frame. Re-running on it made opening the editor execute the user's JS
    // TWICE — onMenuClick writes `edit=true` (a hash-query write, which reorders
    // the params and dispatches its own hashchange, so it does not look like a
    // self-write) and then runs the frame itself. Frames that append to
    // `document.body` rather than `root` visibly duplicated their output.
    // Excluding it also means closing the editor no longer restarts the app.
    // `hm` is the same kind of thing: it only decides whether the frame's own
    // hamburger/edit button is shown, which an embedder that supplies its own
    // chrome (framejs.app's frame page) turns off.
    const NON_EXECUTION_PARAMS = new Set([
      "og",
      "css",
      "editorWidth",
      "edit",
      "hm",
    ]);

    // Build a lightweight snapshot from the raw hash string by filtering
    // out non-execution params. Avoids full parse + JSON.stringify of
    // potentially large base64-encoded values on every hashchange.
    //
    // SORTED, because a write through @metapages/hash-query rewrites the whole
    // hash and does not preserve the incoming param order: removeEditor()
    // clearing `edit` on every plain load turned `#?js=..&hm=..` into
    // `#?hm=..&js=..`, which an order-sensitive snapshot read as a content
    // change and answered with a second run of the user's JS. Reordering the
    // same params is never a content change.
    const getExecutionParamSnapshot = () => {
      let raw = currentHashString();
      if (!raw) return "";
      if (raw.charAt(0) === "#") raw = raw.slice(1);
      if (raw.charAt(0) === "?") raw = raw.slice(1);
      if (!raw) return "";
      const pairs = raw.split("&");
      const kept = [];
      for (let i = 0; i < pairs.length; i++) {
        const eqIdx = pairs[i].indexOf("=");
        const key = eqIdx === -1 ? pairs[i] : pairs[i].substring(0, eqIdx);
        if (key && !NON_EXECUTION_PARAMS.has(key)) {
          kept.push(pairs[i]);
        }
      }
      kept.sort();
      return kept.join("&");
    };

    let lastExecutionSnapshot = getExecutionParamSnapshot();

    // Returns true (and updates snapshot) when execution-relevant params changed
    const hasExecutionParamsChanged = () => {
      const current = getExecutionParamSnapshot();
      if (current === lastExecutionSnapshot) return false;
      lastExecutionSnapshot = current;
      return true;
    };

    // reload on hash changes and refresh service worker config
    globalThis.addEventListener("hashchange", () => {
      // True when this event came from the frame writing its own state (see
      // announceSelfHashWrites above), rather than from an external edit.
      const isSelfWrite = selfHashWrite;
      // Refresh service worker config when hash changes
      const newConfig = getServiceWorkerConfig();
      globalThis.serviceWorkerConfig = newConfig;
      if (globalThis.serviceWorkerManager.registration) {
        globalThis.serviceWorkerManager.updateConfig(newConfig);
      }
      // Apply the transient `css` param on every hash change (it is excluded
      // from the execution snapshot above, so it never re-runs the user JS).
      applyCssFromUrl();
      // Keep the split/handle in sync with `editorWidth` (and edit mode)
      // without re-running the user's JS.
      applyEditorLayout();
      // `edit` no longer re-runs the frame (see NON_EXECUTION_PARAMS), so the
      // editor teardown that used to ride along on that re-run — runJsFromUrl's
      // `if (!inEditMode) removeEditor()` — happens here instead. Without it an
      // embedder that drops `edit` from the hash would leave the editor mounted
      // in a zero-width pane. Guarded on the container so removeEditor's own
      // `edit` write cannot re-enter. Read from window.location.hash, not
      // currentHashString(): `edit` is a URL flag (NON_OVERRIDABLE_PARAMS keeps
      // it out of a short URL's stored params), and that is where removeEditor
      // clears it.
      const [, liveHashParams] = getUrlHashParamsFromHashString(
        window.location.hash,
      );
      if (
        liveHashParams["edit"] !== "true" &&
        document.getElementById("iframe-container")
      ) {
        removeEditor();
      }
      // Always evaluate this, even for a self-write: it advances the snapshot,
      // so the frame's own state write is not mistaken for an external change
      // the next time some unrelated param moves.
      const executionParamsChanged = hasExecutionParamsChanged();
      if (executionParamsChanged && !isSelfWrite) {
        runJsFromUrl();
      }
    }, false);

    const metapageDef = {
      metaframes: {
        editor: {
          url: `${window.location.origin}/editor/#?c=eyJtb2R1bGVzIjpbXX0=`,
        },
      },
      version: "0.3",
    };

    const removeEditor = () => {
      if (globalThis.metapageEditor) {
        globalThis.metapageEditor.dispose();
        globalThis.metapageEditor = null;
      }
      const previousContainer = document.getElementById(
        "iframe-container",
      );
      if (previousContainer) {
        previousContainer.parentElement.removeChild(
          previousContainer,
        );
      }
      refreshUpdateSvgButton();

      if (!window.__SHORT_URL_ID) {
        setHashParamInWindow("edit", undefined);
      }
      document.getElementById("root").className = "root borderFatSolidGreen";
      document.getElementById("editor-root").className =
        "editor-container-hidden borderDashedBlue";
      const resizeHandle = document.getElementById("editor-resize-handle");
      if (resizeHandle) resizeHandle.style.display = "none";
    };

    const onMenuClick = async () => {
      var shortUrlId = window.__SHORT_URL_ID;
      // A uuid short URL (32 hex chars, dashes optional) is backed by
      // framejs.app; a sha256 short URL (64 hex chars) is backed by this
      // worker's S3 store. They have different edit behaviours.
      var isUuidShortUrl = !!shortUrlId &&
        /^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$/i
          .test(shortUrlId);

      // uuid short URL: open the canonical short URL on the framejs.app host.
      // framejs.app expects the uuid with the dashes removed. `#?edit=true`
      // tells framejs.app to open the embedded editor right away; framejs.app
      // consumes and strips it so its URL stays clean.
      if (isUuidShortUrl) {
        var uuidNoDashes = shortUrlId.replace(/-/g, "");
        var editUrl = (window.__FRAMEJS_APP_ORIGIN || window.location.origin) +
          "/j/" + uuidNoDashes + "#?edit=true";
        if (isIframe()) {
          window.open(editUrl, "_blank");
        } else {
          window.location.href = editUrl;
        }
        return;
      }

      // sha256 short URL: expand the params into a full hash URL with edit
      // mode. This is the one place the expansion is wanted — it exits the
      // short URL path entirely so the local editor works normally.
      if (shortUrlId && window.__SHORT_URL_HASH_PARAMS) {
        var expanded = parseHashPairs(currentHashString());
        if (!("edit" in expanded.pairs)) expanded.order.push("edit");
        expanded.pairs["edit"] = "edit=true";
        var merged = expanded.order.map(function (key) {
          return expanded.pairs[key];
        }).join("&");
        window.location.href = window.location.origin + "/#?" + merged;
        return;
      }

      // if there is an existing editor, remove it, then exit
      if (document.getElementById("iframe-container")) {
        removeEditor();
        runJsFromUrl();
        return;
      }
      setHashParamInWindow("edit", true);

      document.getElementById("menu-button").style.display = "none";

      // no previous editor detected, add the editor metapage
      // listen to the editor metapage for changes to the editor url hash
      // and make that our own url hash
      document.getElementById("root").className =
        "root-with-editor borderFatSolidGreen";

      document.getElementById("editor-root").className =
        "editor-container-shown borderDashedBlue";

      // Modify the metapage editor url hash to our own
      const editorUrl = new URL(metapageDef.metaframes.editor.url);
      editorUrl.hash = currentHashString();
      metapageDef.metaframes.editor.url = editorUrl.href;

      const mp = await globalThis.metapage.Metapage.from(metapageDef);
      globalThis.metapageEditor = mp;
      const editorMetaframe = mp.getMetaframe("editor");
      const iframe = await editorMetaframe.iframe;

      try {
        const inputsUnpacked = await getInputsSmartUnpacked();
        globalThis.metapageEditor.setInputs({
          editor: inputsUnpacked,
        });
      } catch (err) {
        console.error(
          "Error setting metapage editor inputs on creation",
          err,
        );
      }

      var iframeDivContainer = document.createElement("div");
      iframeDivContainer.id = "iframe-container";
      iframeDivContainer.className = "iframe-container";
      iframeDivContainer.appendChild(iframe);

      document.getElementById("editor-root").append(
        iframeDivContainer,
      );
      runJsFromUrl();

      let pending;
      const updateCode = (hash) => {
        if (pending) {
          clearTimeout(pending);
        }
        pending = setTimeout(() => {
          pending = null;
          window.location.hash = hash;
        }, 400);
      };
      mp.addListener(
        globalThis.metapage.Metapage.DEFINITION,
        (event) => {
          const url = event?.definition?.metaframes?.editor?.url;
          if (url) {
            const urlBlob = new URL(url);
            updateCode(urlBlob.hash);
          }
        },
      );
    };

    document
      .getElementById("menu-button")
      .addEventListener("click", onMenuClick);

    refreshUpdateSvgButton();

    const [_, hashParams] = getUrlHashParamsFromHashString(currentHashString());
    const inEditMode = hashParams["edit"] === "true";
    // Show editor if the hash param is set to edit=true
    // DISABLED: previously also auto-opened the editor when the page is not in
    // an iframe AND there is no js in the hash params (i.e. opened in a window).
    // To re-enable, restore the commented-out condition below.
    // if (inEditMode || (!getJsFromUrl() && !isIframe())) {
    if (inEditMode) {
      // if editing, force showing the menu
      window.addEventListener("load", () => {
        onMenuClick();
      });
    }
    </script>

    <!-- Rich-text export ────────────────────────────────────────────────────
         Hand this frame's RENDERED html to whoever embeds it.

         framejs.app's frame menu offers "Copy content as rich text" — paste the
         frame into Substack, a doc, an email. It cannot read a single node of
         this document (different origin), so it asks and we answer: a cleaned
         clone of #root, with canvases and svgs painted into <img>s (neither
         survives a clone, let alone a paste) and every url made absolute. The
         embedder strips the styling from there (framejs.app: lib/richText.ts).

         We only ever reply to a request, and only with the content that request
         already handed us to render. Known limit: content inside a shadow root
         does not clone, so it does not travel. -->
    <script id="rich-text-export">
    (function () {
      const REQUEST = "framejs:get-html";
      const RESPONSE = "framejs:html";
      // Ours, not the frame's — never part of its content.
      const CHROME =
        "#menu-button, #editor-root, #editor-resize-handle, #landing-content";
      const CODE = "script, style, link, meta, noscript, template";

      const px = (value) => (value > 0 ? String(Math.round(value)) : "");

      // Stand-in image for something that only exists as live pixels/vector.
      const imageFor = (src, live) => {
        const img = document.createElement("img");
        img.setAttribute("src", src);
        const rect = live.getBoundingClientRect();
        if (px(rect.width)) img.setAttribute("width", px(rect.width));
        if (px(rect.height)) img.setAttribute("height", px(rect.height));
        const alt = live.getAttribute("aria-label") || live.getAttribute("title");
        if (alt) img.setAttribute("alt", alt);
        return img;
      };

      // A canvas clones blank, so take its pixels now. A tainted one (a
      // cross-origin image was drawn into it) throws — better dropped than
      // pasted blank.
      const canvasImage = (live) => {
        try {
          const src = live.toDataURL("image/png");
          return src && src.length > 32 ? imageFor(src, live) : null;
        } catch (err) {
          return null;
        }
      };

      // An svg pastes as nothing in most editors, but survives as an image if
      // it carries its own size and namespace.
      const svgImage = (live, clone) => {
        try {
          const svg = clone.cloneNode(true);
          const rect = live.getBoundingClientRect();
          if (!svg.getAttribute("xmlns")) {
            svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
          }
          if (!svg.getAttribute("width") && px(rect.width)) {
            svg.setAttribute("width", px(rect.width));
          }
          if (!svg.getAttribute("height") && px(rect.height)) {
            svg.setAttribute("height", px(rect.height));
          }
          const xml = new XMLSerializer().serializeToString(svg);
          return imageFor(
            "data:image/svg+xml," + encodeURIComponent(xml),
            live,
          );
        } catch (err) {
          return null;
        }
      };

      // Pairs live nodes with their clones by document order — the two trees
      // are identical until the first edit below, and nothing runs in between.
      const snapshotInto = (live, clone, selector, toImage) => {
        const originals = live.querySelectorAll(selector);
        const copies = clone.querySelectorAll(selector);
        for (let i = 0; i < copies.length; i++) {
          const image = originals[i] ? toImage(originals[i], copies[i]) : null;
          if (image) copies[i].replaceWith(image);
          else copies[i].remove();
        }
      };

      const renderedHtml = () => {
        const live = document.getElementById("root") || document.body;
        const clone = live.cloneNode(true);

        snapshotInto(live, clone, "canvas", canvasImage);
        snapshotInto(live, clone, "svg", svgImage);

        clone.querySelectorAll(CHROME).forEach((el) => el.remove());
        clone.querySelectorAll(CODE).forEach((el) => el.remove());

        // The clone keeps this document's base url, so reading the property
        // and writing it back is what makes a relative url absolute — the
        // embedder is on another origin and cannot resolve one.
        clone.querySelectorAll("img").forEach((img) => {
          img.setAttribute("src", img.src);
        });
        clone.querySelectorAll("a[href]").forEach((a) => {
          a.setAttribute("href", a.href);
        });

        return clone.innerHTML;
      };

      globalThis.addEventListener("message", (event) => {
        const data = event && event.data;
        if (!data || data.type !== REQUEST || !event.source) return;

        let payload;
        try {
          payload = { html: renderedHtml() };
        } catch (err) {
          payload = { html: "", error: String((err && err.message) || err) };
        }
        payload.type = RESPONSE;
        payload.requestId = data.requestId;
        // Answer the asker, at the origin it asked from — never broadcast.
        event.source.postMessage(
          payload,
          event.origin && event.origin !== "null" ? event.origin : "*",
        );
      });
    })();
    </script>

  </body>
