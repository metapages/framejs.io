name: Deploy

on:
  push:
    branches:
      - 'main'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository
    env:
      # Job-level so the Cloudflare step's `if` can see whether it is set.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Clone repo
        uses: actions/checkout@v3
        with:
          # token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: '0'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '25.x'

      - name: Setup just
        uses: extractions/setup-just@v2
        with:
          just-version: '1.25.2'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1 

      # Gate the deploy: regenerate + validate the framejs skill before publishing
      - name: Validate framejs skill
        run: just check-skill

      - name: Unignore build output for deploy
        run: find . -type f -name .gitignore -delete

      - name: Build
        run: just build

      # Production is moving from Deno Deploy to Cloudflare Workers. Until the
      # DNS cutover both are deployed, so either can serve the current version
      # (and Deno Deploy stays a live rollback target). The Deno step is
      # removed at the cutover.
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: just deploy-cloudflare

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: just deploy-deno

