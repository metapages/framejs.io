name: Deploy

on:
  push:
    branches:
      - 'main'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to clone the repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Clone repo
        uses: actions/checkout@v3
        with:
          # token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: '0'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '25.x'

      - name: Setup just
        uses: extractions/setup-just@v2
        with:
          just-version: '1.25.2'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1 

      # Gate the deploy: regenerate + validate the framejs skill before publishing
      - name: Validate framejs skill
        run: just check-skill

      - name: Build
        run: just build

      - name: Deploy to Cloudflare Workers
        run: just deploy-cloudflare
