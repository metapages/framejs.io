# Publishes BOTH Python packages from ONE workflow file, deliberately:
# PyPI trusted publishing pins the workflow FILENAME (plus repo + environment),
# so moving either package into its own workflow would need a new publisher
# configured on PyPI first. `metaframe-widget` is now a compatibility shim that
# forwards to `framejs` (see python-compat/) and is published with
# `skip-existing`, so a release that only bumps `framejs` is not an error.
name: Publish Python Package

on:
  push:
    tags:
      - "python-v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only a python-v<version> tag publishes, and hatch builds whatever
      # pyproject.toml says, so a tag that doesn't match would re-upload the
      # previous version and fail on PyPI. Use `just python-publish-ci <version>`.
      - name: Tag matches pyproject versions
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          for f in python/pyproject.toml python-compat/pyproject.toml; do
            grep -q "^version = \"$version\"$" "$f" \
              || { echo "::error file=$f::version is not $version (tag $GITHUB_REF_NAME)"; exit 1; }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "python/[dev]"
      - run: cd python && pytest tests/ -v
      # The shim must import and re-export the real package, or an existing
      # `pip install metaframe-widget` breaks on upgrade.
      - run: pip install -e python-compat/
      - run: python -c "import metaframe_widget, framejs; assert metaframe_widget.MetaframeWidget is framejs.Frame"

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/framejs/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hatch
      - run: cd python && hatch build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

      # The `metaframe-widget` shim. Its version tracks `framejs`, so most tags
      # re-publish an unchanged version — `skip-existing` makes that a no-op
      # instead of a "file already exists" failure.
      - run: cd python-compat && hatch build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-compat/dist/
          skip-existing: true
