name: metaframe-js

services:
  # Local S3. `weed mini` runs SeaweedFS's master, volume, filer and S3 gateway
  # in one process and creates the bucket. Credentials and the anonymous
  # public-read grant on `uploads` live in .seaweedfs/s3.json.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -bucket=uploads
      - -s3.config=/etc/seaweedfs/s3.json
      # SigV4 signs the host the presigned URL was minted for. Behind traefik
      # SeaweedFS derives the host from X-Forwarded-Host, which for a pr-daemon
      # preview is the local `localhost` rather than the public s3 host, so name
      # the browser-facing endpoint explicitly: it is always tried first.
      - -s3.externalUrl=${S3_PRESIGN_ENDPOINT:-https://s3.localhost:${APP_PORT:-443}}
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.telemetry=false
    # Published only for developer convenience (the filer UI on :8888 to browse
    # buckets, and poking at the S3 API directly). Nothing in the stack or the
    # tests needs them: the worker and seaweedfs-init reach it over the compose
    # network, and the browser reaches it through traefik at s3.localhost. So CI
    # sets both to 0 (ephemeral) — a shared runner may well already have 8333
    # bound by another stack, and a fixed host port turns that into a failed
    # `up` for a port no test uses.
    # Loopback only: the filer HTTP API has NO auth (the SigV4 check and the
    # read-only anonymous grant apply only to the S3 gateway), so on 0.0.0.0
    # anyone on the network could write or delete bucket objects.
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "127.0.0.1:${SEAWEEDFS_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs_data:/data
      - ./.seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: curl --fail http://localhost:8333/healthz || exit 1
      interval: 5s
      timeout: 1s
      # `weed mini` starts master, volume, filer and S3 in sequence; give a slow
      # runner time before the default 3 retries can mark it unhealthy.
      start_period: 30s
    logging:
      driver: ${LOGGING_SERVER:-local}
    labels:
      - traefik.enable=true
      - traefik.http.routers.s3.tls=true
      - traefik.http.routers.s3.rule=Host(`s3.localhost`)
      - traefik.http.services.s3.loadbalancer.server.port=8333
      - traefik.http.routers.s3.middlewares=s3-cors
      - traefik.http.middlewares.s3-cors.headers.accesscontrolalloworiginlist=*
      - traefik.http.middlewares.s3-cors.headers.accesscontrolallowmethods=GET,PUT,POST,DELETE,OPTIONS,HEAD
      - traefik.http.middlewares.s3-cors.headers.accesscontrolallowheaders=Content-Type,Content-Length,Accept,Authorization,X-Amz-Date,X-Amz-Security-Token,X-Amz-Content-Sha256,X-Amz-User-Agent,x-amz-acl
      - traefik.http.middlewares.s3-cors.headers.accesscontrolmaxage=86400
      - traefik.http.middlewares.s3-cors.headers.accesscontrolexposeheaders=ETag,x-amz-request-id
      # pr-daemon previews (see `pr-daemon-up` in the justfile). The browser
      # reaches S3 at a PUBLIC host (https://<branch>--s3.<domain>), and
      # pr-daemon forwards those requests here with the LOCAL Host header it was
      # given (localhost): this router catches them. Signatures still verify
      # because -s3.externalUrl above names the public host. Inert unless
      # S3_PREVIEW_UPSTREAM_HOST is set (`.invalid` never resolves).
      - traefik.http.routers.s3-preview.tls=true
      - traefik.http.routers.s3-preview.rule=Host(`${S3_PREVIEW_UPSTREAM_HOST:-s3-preview.invalid}`)
      - traefik.http.routers.s3-preview.service=s3
      - traefik.http.routers.s3-preview.middlewares=s3-cors

  # One-shot: the 7-day expiry on transient uploads (`f/`) and the 30-day
  # expiry on standalone HTML exports (`html/`). Filer path TTLs, so `j/` and
  # `favicon/` are kept. Idempotent.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.50
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      { echo 'fs.configure -locationPrefix=/buckets/uploads/f/ -ttl=7d -apply';
      echo 'fs.configure -locationPrefix=/buckets/uploads/html/ -ttl=30d -apply'; }
      | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
      "

  worker:
    build:
      context: ./worker
    command: deno run --unsafely-ignore-certificate-errors -A --watch ./server.ts
    working_dir: /app/worker
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
      # The runtime embeds the editor from /editor/ on this same origin, so a
      # worker that is up before the editor serves its first byte hands the
      # browser a 404 in that iframe. The editor's healthcheck already existed;
      # this is what makes compose actually wait on it.
      editor:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000 || exit 1
      interval: 5s
      timeout: 1s
    environment:
      - "DEV=true"
      - "DENO_DIR=/deno"
      - "DENO_INSTALL_ROOT=/deno"
      - "PORT=3000"
      - "APP_FQDN=${APP_FQDN:-framejs-io.localhost}"
      - "PATH=$PATH:/DENO_INSTALL_ROOT/bin"
      - "S3_ENDPOINT=${S3_ENDPOINT:-http://seaweedfs:8333}"
      - "S3_PRESIGN_ENDPOINT=${S3_PRESIGN_ENDPOINT:-https://s3.localhost:${APP_PORT:-443}}"
      # Locally these must match the keys in .seaweedfs/s3.json, or every upload
      # fails with a signature error.
      - "S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-seaweedadmin}"
      - "S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-seaweedadmin}"
      - "S3_BUCKET_NAME=${S3_BUCKET_NAME:-uploads}"
      # S3_PUBLIC_URL must include the full path prefix matching the S3 key structure.
      # Objects are stored with key "f/{id}" in bucket "uploads", so SeaweedFS serves them
      # at /uploads/f/{id}. Production uses a custom domain (files.framejs.io/f) where
      # the path maps directly to the key, so the /f suffix is needed here too.
      - "S3_PUBLIC_URL=${S3_PUBLIC_URL:-https://s3.localhost:${APP_PORT:-443}/uploads/f}"
      - "S3_UPLOAD_MAX_SIZE_MB=${S3_UPLOAD_MAX_SIZE_MB:-500}"
      - "UMAMI_HOST=${UMAMI_HOST:-https://cloud.umami.is}"
      - "UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}"
      # Backend that resolves a frame UUID to its hash-param values (/j/:uuid).
      - "FRAMEJS_APP_ORIGIN=${FRAMEJS_APP_ORIGIN:-https://framejs.app}"
    extra_hosts:
      - "framejs-app.localhost:host-gateway"
    expose:
      - 3000
    volumes:
      - deno:/deno
      - ./worker:/app/worker
      - ./docs/.vitepress/dist:/app/worker/docs
      - ./editor/src:/app/editor/src
    logging:
      driver: ${LOGGING_SERVER:-local}
    labels:
      - traefik.enable=true
      - traefik.http.routers.app-server.tls=true
      # APP_PUBLIC_FQDN: a pr-daemon preview's public host (see `pr-daemon-up`).
      - traefik.http.routers.app-server.rule=Host("${APP_FQDN:-framejs-io.localhost}") || Host("${APP_PUBLIC_FQDN:-framejs-io.localhost}")

  editor:
    build:
      context: ./editor
      # dockerfile: Dockerfile
    command: just dev
    working_dir: /app/editor
    healthcheck:
      test: curl --fail http://localhost:4440 || exit 1
      interval: 5s
      timeout: 1s
      # A cold start (fresh node_modules volume, empty deno cache) runs npm
      # install and downloads before Vite listens. Without a grace period the
      # default 3 retries mark it unhealthy within ~15s and `up` aborts, since
      # the worker depends on it being healthy.
      start_period: 600s
    environment:
      - "DENO_DIR=/deno"
      - "DENO_INSTALL_ROOT=/deno"
      - "APP_PORT_BROWSER=4440"
      - "APP_PORT=${APP_PORT:-443}"
      - "APP_FQDN=${APP_FQDN:-framejs-io.localhost}"
      # The port the browser opens the HMR websocket on. Differs from APP_PORT
      # only behind a proxy (a pr-daemon preview is served on 443).
      - "HMR_CLIENT_PORT=${HMR_CLIENT_PORT:-${APP_PORT:-443}}"
      - BASE=editor
    expose:
      - 4440
    volumes:
      - deno:/deno
      - node_modules:/app/editor/node_modules
      - ./editor/dist:/app/editor/dist
      - ./editor/public:/app/editor/public
      - ./editor/src:/app/editor/src
      - ./editor/index.html:/app/editor/index.html
      - ./editor/justfile:/app/editor/justfile
      - ./editor/package.json:/app/editor/package.json
      - ./editor/package-lock.json:/app/editor/package-lock.json
      - ./editor/tsconfig.json:/app/editor/tsconfig.json
      - ./editor/vite.config.ts:/app/editor/vite.config.ts
      - ./.git:/app/.git
    logging:
      driver: ${LOGGING_SERVER:-local}
    labels:
      - traefik.enable=true
      - traefik.http.routers.app-editor.tls=true
      - traefik.http.routers.app-editor.rule=(Host("${APP_FQDN:-framejs-io.localhost}") || Host("${APP_PUBLIC_FQDN:-framejs-io.localhost}")) && PathPrefix(`/editor`)

  docs:
    image: node:25-alpine
    command: sh -c "npm install && npx vitepress dev --host 0.0.0.0 --port 4173"
    working_dir: /app/docs
    environment:
      # Allowed as a dev-server host (see vite.server.allowedHosts in config.ts)
      - "APP_PUBLIC_FQDN=${APP_PUBLIC_FQDN:-}"
    expose:
      - 4173
    volumes:
      - docs_node_modules:/app/docs/node_modules
      - ./docs:/app/docs
    logging:
      driver: ${LOGGING_SERVER:-local}
    labels:
      - traefik.enable=true
      - traefik.http.routers.app-docs.tls=true
      - traefik.http.routers.app-docs.rule=(Host("${APP_FQDN:-framejs-io.localhost}") || Host("${APP_PUBLIC_FQDN:-framejs-io.localhost}")) && PathPrefix(`/docs`)
      - traefik.http.services.app-docs.loadbalancer.server.port=4173
      # VitePress base is /docs/ (with trailing slash), so bare /docs is outside
      # the base and shows "did you mean /docs/?". Redirect /docs → /docs/ to
      # match the worker's prod redirect (worker/server.ts).
      - traefik.http.routers.app-docs.middlewares=docs-add-slash
      - traefik.http.middlewares.docs-add-slash.redirectregex.regex=^(https?://[^/]+)/docs$$
      - traefik.http.middlewares.docs-add-slash.redirectregex.replacement=$${1}/docs/

  traefik:
    image: "traefik:v2.11"
    # No container_name on purpose: compose names this metaframe-js-traefik-1,
    # scoped to the project. A fixed name is global to the docker daemon, so on
    # a shared machine (the CI runner, or a dev box running several metapages
    # stacks) any container still holding it — including one stranded by a run
    # that died mid-`up` — makes every later `up` fail with a name conflict that
    # compose cannot clear itself: the squatter belongs to no project, so
    # `down --remove-orphans` does not reach it. Traefik discovers services
    # through docker.sock labels, so nothing depends on what it is called.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik=true"
    ports:
      # HTTPS / SSL port
      - "${APP_PORT:-443}:443"
      # The Traefik Web UI port (enabled by api:insecure: true in traefik.yml)
      - "${TRAEFIK_WEB_UI_PORT:-8080}:8080"
    volumes:
      # Overridable so a pr-daemon preview can scope the docker provider to its
      # own compose project (see `pr-daemon-up`).
      - ${TRAEFIK_STATIC_CONFIG:-./.traefik/traefik.yml}:/etc/traefik/traefik.yml:ro
      - ./.traefik/config.yml:/etc/traefik/config.yml:ro
      - ./.traefik/certs:/etc/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  deno:
    driver: local
  node_modules:
    driver: local
  seaweedfs_data:
    driver: local
  docs_node_modules:
    driver: local
