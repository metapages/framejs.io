[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "framejs"
version = "0.5.2"
description = "Embed framejs frames as interactive widgets in Jupyter and marimo notebooks"
license = "MIT"
requires-python = ">=3.8"
readme = "README.md"
dependencies = [
    "anywidget>=0.9.0",
    "traitlets>=5.0.0",
]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://framejs.io/docs/integrations/jupyter"
Repository = "https://github.com/metapages/framejs.io"
Issues = "https://github.com/metapages/framejs.io/issues"
Changelog = "https://github.com/metapages/framejs.io/blob/main/python/README.md"

[project.optional-dependencies]
jupyter = ["jupyterlab"]
marimo = ["marimo"]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/framejs"]
